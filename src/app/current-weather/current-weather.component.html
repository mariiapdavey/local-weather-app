<div>
    <div>
        <div>
            {{current.city}}, {{current.country}}
        </div>
        <div>
            {{current.date | date:'MMMM dd, YYYY'}}
        </div>
    </div>
    <div>
       {{current.date | date:'EEEE'}}
    </div>

    <div>
        <img [src]="current.image" />
        {{current.description}}
        
    </div>

    <div>  
       <span>{{current.temperature | number:'1.0-0'}} &deg;F</span>
       <span> Feels like {{current.feels_like | number:'1.0-0'}} &deg;F</span>

    </div>
</div>
